<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складской поиск</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; background-color: #f0f2f5; max-width: 600px; margin: 0 auto; padding-bottom: 50px; }
        
        /* Search Bar */
        .search-container { margin-bottom: 15px; }
        #searchInput { 
            width: 100%; padding: 12px; font-size: 16px; 
            border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
        }
        
        /* Search Results */
        #searchList { 
            text-align: left; background: white; 
            border: 1px solid #ddd; border-radius: 8px; 
            margin-bottom: 15px; display: none; 
            max-height: 300px; overflow-y: auto;
            position: relative; z-index: 100;
        }
        .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .search-item:hover { background-color: #f9f9f9; }
        .item-name { font-weight: bold; font-size: 0.9em; color: #333; }
        .item-barcode { font-size: 0.8em; color: #888; }

        /* Camera */
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
        
        /* Result Card */
        #resultCard { 
            margin-top: 20px; padding: 20px; border-radius: 8px; 
            background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            display: none; text-align: left;
        }
        .label { font-weight: bold; color: #888; font-size: 0.8em; margin-top: 10px; }
        .value { font-size: 1.1em; color: #000; font-weight: 500; word-wrap: break-word; line-height: 1.3; }
        
        /* Barcode specific style */
        .barcode-row { margin-bottom: 5px; }
        .barcode-value { font-family: monospace; font-size: 1.1em; color: #333; background: #f5f5f5; padding: 5px; border-radius: 4px; display: inline-block; }
        .barcode-tag { font-size: 0.8em; color: #666; font-weight: bold; display: inline-block; width: 50px; }

        .location-box { 
            background: #e3f2fd; color: #0d47a1; padding: 15px; 
            border-radius: 4px; text-align: center; 
            font-size: 2em; font-weight: bold; margin-top: 5px;
        }

        /* Marketplace Buttons */
        .market-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .market-link {
            flex: 1;
            display: block;
            text-decoration: none;
        }
        .market-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: transform 0.1s;
            min-height: 50px; 
            background-color: #eee;
        }
        .market-link:active .market-img { transform: scale(0.95); }
        
        /* Main Action Button */
        .btn-reset { 
            margin-top: 20px; padding: 12px 24px; font-size: 16px; 
            cursor: pointer; width: 100%; background: #333; 
            color: white; border: none; border-radius: 4px;
        }
        #status { margin-bottom: 10px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Поиск (название или штрихкод)..." onkeyup="doSearch()">
    </div>

    <div id="searchList"></div>
    <div id="status">Загрузка базы...</div>
    <div id="reader"></div>

    <!-- RESULT CARD -->
    <div id="resultCard">
        <div class="label">НАИМЕНОВАНИЕ:</div>
        <div id="resName" class="value"></div>
        
        <div class="label">ШТРИХКОДЫ:</div>
        <div id="resBarcode" class="value"></div>

        <div class="label">ЯЧЕЙКА:</div>
        <div id="resLocation" class="location-box"></div>

        <!-- Marketplace Images -->
        <div class="market-buttons">
            <!-- OZON -->
            <a id="linkOzon" class="market-link" target="_blank">
                <img id="imgOzon" class="market-img" src="" alt="Ozon">
            </a>
            <!-- WB -->
            <a id="linkWB" class="market-link" target="_blank">
                <img id="imgWB" class="market-img" src="" alt="WB">
            </a>
        </div>
        
        <button class="btn-reset" onclick="resetApp()">Вернуться к поиску</button>
    </div>

    <script>
        // --- 0. PRELOAD IMAGES ---
        const imagesToPreload = [
            "img/ozon_link.jpg",
            "img/wb_link.jpg",
            "img/no_ozon_link.jpg",
            "img/no_wb_link.jpg"
        ];
        imagesToPreload.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        let barcodeMap = {}; 
        let dataArray = []; 
        let html5QrcodeScanner = null;

        // --- 1. LOAD DATA ---
        fetch('data.csv')
            .then(response => response.text())
            .then(text => {
                const lines = text.split('\n');
                lines.forEach((line, index) => {
                    const parts = line.split(';');
                    
                    if (parts.length >= 4) {
                        const ozonCode = parts[0].trim();
                        const wbCode = parts[1].trim();
                        const name = parts[2].trim();
                        const loc = parts[3].trim();
                        const ozonLink = parts[4] ? parts[4].trim() : "";
                        const wbLink = parts[5] ? parts[5].trim() : "";

                        if(ozonCode === "Штрихкод OZON") return;
                        if(!name && !ozonCode && !wbCode) return;

                        const product = {
                            id: index, 
                            name: name,
                            loc: loc,
                            ozonLink: ozonLink,
                            wbLink: wbLink,
                            ozonCode: ozonCode, 
                            wbCode: wbCode,     
                            codes: [ozonCode, wbCode].filter(c => c !== "" && c !== "#Н/Д")
                        };

                        if(ozonCode && ozonCode !== "#Н/Д") barcodeMap[ozonCode] = product;
                        if(wbCode && wbCode !== "#Н/Д") barcodeMap[wbCode] = product;

                        dataArray.push(product);
                    }
                });
                document.getElementById('status').innerText = "База загружена. Сканируйте.";
                startScanner();
            })
            .catch(err => {
                document.getElementById('status').innerText = "Ошибка: data.csv не найден";
                console.error(err);
            });

        // --- 2. SEARCH LOGIC ---
        function doSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listDiv = document.getElementById('searchList');
            const readerDiv = document.getElementById('reader');
            
            listDiv.innerHTML = '';

            if (query.length < 2) {
                listDiv.style.display = 'none';
                if(document.getElementById('resultCard').style.display === 'none') {
                    readerDiv.style.display = 'block'; 
                }
                return;
            }

            readerDiv.style.display = 'none';
            listDiv.style.display = 'block';

            const results = dataArray.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.codes.some(c => c.includes(query))
            );

            if (results.length === 0) {
                listDiv.innerHTML = '<div class="search-item">Ничего не найдено</div>';
                return;
            }

            results.slice(0, 20).forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                const displayCode = item.codes.length > 0 ? item.codes[0] : "Без штрихкода";
                
                div.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-barcode">${displayCode}</div>
                `;
                
                div.dataset.id = item.id;
                
                div.onclick = function() {
                    const clickedProduct = dataArray.find(p => p.id == this.dataset.id);
                    renderProductCard(clickedProduct);
                };
                
                listDiv.appendChild(div);
            });
        }

        // --- 3. DISPLAY PRODUCT ---
        function renderProductCard(product) {
            if (html5QrcodeScanner) { try { html5QrcodeScanner.pause(); } catch(e){} }

            document.getElementById('searchList').style.display = 'none';
            document.getElementById('reader').style.display = 'none';
            document.getElementById('searchInput').value = '';
            
            const card = document.getElementById('resultCard');
            const nameDiv = document.getElementById('resName');
            const locDiv = document.getElementById('resLocation');
            const barcodeDiv = document.getElementById('resBarcode'); 
            
            const linkOzon = document.getElementById('linkOzon');
            const imgOzon = document.getElementById('imgOzon');
            const linkWB = document.getElementById('linkWB');
            const imgWB = document.getElementById('imgWB');

            if (product) {
                nameDiv.innerText = product.name;
                locDiv.innerText = product.loc;
                locDiv.style.backgroundColor = "#e3f2fd"; 
                locDiv.style.color = "#0d47a1";

                // --- SHOW BARCODES ---
                let barcodeHtml = "";
                
                if(product.ozonCode && product.ozonCode !== "#Н/Д") {
                    barcodeHtml += `<div class="barcode-row"><span class="barcode-tag">OZON:</span><span class="barcode-value">${product.ozonCode}</span></div>`;
                }
                
                if(product.wbCode && product.wbCode !== "#Н/Д") {
                    barcodeHtml += `<div class="barcode-row"><span class="barcode-tag">WB:</span><span class="barcode-value">${product.wbCode}</span></div>`;
                }

                if(barcodeHtml === "") {
                    barcodeHtml = '<div><span class="barcode-value">Нет штрихкода</span></div>';
                }
                
                barcodeDiv.innerHTML = barcodeHtml;

                // --- OZON BUTTON ---
                if (isValidLink(product.ozonLink)) {
                    imgOzon.src = "img/ozon_link.jpg";
                    linkOzon.href = product.ozonLink;
                    linkOzon.style.pointerEvents = "auto";
                    linkOzon.style.opacity = "1";
                } else {
                    imgOzon.src = "img/no_ozon_link.jpg";
                    linkOzon.removeAttribute("href");
                    linkOzon.style.pointerEvents = "none";
                    linkOzon.style.opacity = "0.7";
                }

                // --- WB BUTTON ---
                if (isValidLink(product.wbLink)) {
                    imgWB.src = "img/wb_link.jpg";
                    linkWB.href = product.wbLink;
                    linkWB.style.pointerEvents = "auto";
                    linkWB.style.opacity = "1";
                } else {
                    imgWB.src = "img/no_wb_link.jpg";
                    linkWB.removeAttribute("href");
                    linkWB.style.pointerEvents = "none";
                    linkWB.style.opacity = "0.7";
                }

            } else {
                nameDiv.innerText = "Ошибка";
                locDiv.innerText = "???";
            }
            
            card.style.display = "block";
        }

        function isValidLink(link) {
            if (!link) return false;
            if (link.trim() === "") return false;
            if (link.includes("#Н/Д")) return false; 
            return true;
        }

        // --- 4. SCANNER ---
        function onScanSuccess(decodedText, decodedResult) {
            const product = barcodeMap[decodedText];
            if(product) {
                renderProductCard(product);
            } else {
                alert("Штрихкод " + decodedText + " не найден в базе.");
            }
        }

        function startScanner() {
            // --- UPDATED CONFIGURATION ---
            const config = { 
                fps: 10, 
                qrbox: {width: 250, height: 150},
                // This forces the back camera and requests HD resolution
                videoConstraints: {
                    facingMode: "environment", // Prefer back camera
                    width: { min: 640, ideal: 1280, max: 1920 },
                    height: { min: 480, ideal: 720, max: 1080 }
                },
                formatsToSupport: [ 
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.UPC_A
                ]
            };
            
            html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        function resetApp() {
            document.getElementById('resultCard').style.display = "none";
            document.getElementById('reader').style.display = "block";
            document.getElementById('searchInput').value = '';
            document.getElementById('searchList').style.display = 'none';
            
            if (html5QrcodeScanner) { try { html5QrcodeScanner.resume(); } catch(e){} }
        }
    </script>
</body>
</html>
